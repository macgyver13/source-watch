# Seeded sources and live collectors for this watch instance.
# Identity (name, base_url, description, default_tag, chips, topics, relevance)
# lives in config/watch.yaml. This file is only seeds + collectors.
# This file is for preview/frost only; do not merge to main.
#
# Leave these lists empty for a blank fork. Add entries, then run
# scripts/build_seed_feed.py to fill site/static artifacts.
#
# Optional per seed:
#   discovered_at:  ISO timestamp; weeks and "new" sort use this (stable).
#   activity_at:    ISO timestamp; latest-activity views use this.
#   live_activity:  false to skip GitHub pushed_at on noisy monorepos
#                   (pair with github_pull_requests for the real PRs).
# Live GitHub searches use repo created_at as discovered_at.
# Live Delving collectors use topic created_at / last_posted_at.
# Category listings take a numeric id or parent/slug/id path
# (example: 12 or implementation/wg-silent-payments/12). Slug alone 404s.
#
# Example:
# seeded_sources:
#   docs_pages:
#     - id: example-docs
#       name: Example docs
#       url: https://example.com/docs
#       project: Example
#       tags: [docs]
#       summary: A page this watch should track.
#   github_repositories:
#     - id: example-repo
#       repo: example/repo
#       project: Example
#       tags: [docs]
#       summary: A repository this watch should track.
#   github_pull_requests:
#     - id: example-pr
#       name: "example/repo #1"
#       url: https://github.com/example/repo/pull/1
#       project: Example
#       tags: [docs, pull-request]
# live_collectors:
#   github_repository_searches:
#     - id: example-search
#       query: 'topic:documentation archived:false'
#       max_results: 5
#       tags: [example, github, candidate, repository-discovery]
#   delving_topic_searches:
#     - id: example-delving-frost
#       query: 'frost in:title'
#       max_results: 5
#       tags: [example, delving, candidate, topic-discovery]
#     - id: example-delving-silent-payments
#       query: '"silent payments" in:title'
#       max_results: 5
#       tags: [example, delving, candidate, topic-discovery]
#     - id: example-delving-quantum
#       query: 'quantum in:title'
#       max_results: 5
#       tags: [example, delving, candidate, topic-discovery]
#   delving_category_listings:
#     - id: example-delving-category
#       category: 12
#       max_results: 10
#       tags: [example, delving, candidate, topic-discovery]


seeded_sources:
  docs_pages: []
  github_repositories: []
  github_pull_requests: []
  crates: []

live_collectors:
  github_repository_searches:
    - id: github-frost-bitcoin-repo-discovery
      query: 'frost bitcoin threshold archived:false'
      max_results: 10
      tags: [frost, github, candidate, repository-discovery]
    - id: github-musig2-repo-discovery
      query: 'musig2 archived:false'
      max_results: 10
      tags: [musig2, github, candidate, repository-discovery]
  delving_topic_searches:
    - id: delving-frost
      query: frost
      max_results: 10
      tags: [frost, delving, candidate, topic-discovery]
    - id: delving-musig2
      query: musig2
      max_results: 10
      tags: [musig2, delving, candidate, topic-discovery]
  delving_category_listings: []
