# Silent Payments Watch — preview/silent-payments only.
# Do not merge this file to source-watch main.

seeded_sources:
  docs_pages: []
  github_repositories: []
  github_pull_requests: []
  crates: []

live_collectors:
  github_repository_searches:
    - id: github-silent-payments-repo-discovery
      query: '"silent payments" archived:false'
      max_results: 10
      tags: [silent-payments, github, candidate, repository-discovery]
    - id: github-bip352-repo-discovery
      query: 'BIP352 archived:false'
      max_results: 10
      tags: [silent-payments, bip352, github, candidate, repository-discovery]
