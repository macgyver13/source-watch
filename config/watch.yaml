topics:
  - title: BIP-360
    slug: bip360
    blurb: Pay-to-Merkle-Root (P2MR), SegWit v2 script-tree outputs.
    note: Current name of the quantum-resistant output type (was P2QRH and P2TSH).
  - title: Hash-based signatures
    slug: hash-based
    blurb: SPHINCS+, SLH-DSA, XMSS, Winternitz, SHRINCS, PRAWNS.
    note: Conservative PQ signatures that reuse Bitcoin's hash assumptions.
  - title: SHRINCS
    slug: shrincs
    blurb: Stateful hash-based signatures with a stateless fallback.
    note: ~324-byte signatures when state is intact.
  - title: PRAWNS
    slug: prawns
    blurb: Threshold Winternitz signatures that look like ordinary HBSS.
    note: PRF-Assisted Winternitz n-party Signatures.
  - title: Isogeny
    slug: isogeny
    blurb: SQIsign / PRISM path toward HD wallets and silent payments.
    note: Compact PQ crypto that keeps algebraic structure.
