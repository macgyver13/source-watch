name: Post-Quantum Watch
base_url: https://example.com/
description: Public activity on BIP-360, P2MR, P2QRH, hash-based signatures, and related post-quantum Bitcoin work.
default_tag: post-quantum
preferred_chips:
  - bip360
  - p2mr
  - p2qrh
  - shrincs
  - hash-based
  - prawns
  - isogeny
  - bitcoin
hidden_tags:
  - github
  - repository-discovery
  - candidate
  - pull-request
