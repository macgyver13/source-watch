name: Example Watch
base_url: https://example.com/
description: >-
  Example public-source activity watch. Replace this config with your project.
default_tag: example
preferred_chips:
  - docs
  - spec
hidden_tags:
  - github
  - repository-discovery
  - candidate
  - pull-request
  - package
relevance:
  always_match: []   # accept if any of these appear in repo description/topics
  required_any: []   # if non-empty, one of these must appear; empty = no required term
  context_any: []    # if required_any is set AND this is non-empty, also need one of these
topics: []           # optional extra Start-here tiles: [{title, slug, blurb, note}]
