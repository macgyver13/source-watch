name: Example Watch
base_url: https://example.com/
description: Public activity on tracked sources.
default_tag: example
preferred_chips:
  - docs
  - spec
hidden_tags:
  - github
  - repository-discovery
  - pull-request-discovery
  - candidate
  - pull-request
  - package
  - delving
  - topic-discovery
relevance:
  always_match: []   # accept if any of these appear in description/topics/title/excerpt
  required_any: []   # if non-empty, one of these must appear; empty = no required term
  context_any: []    # if required_any is set AND this is non-empty, also need one of these
discovered_after: ""  # ISO date; drop live hits and ignore GitHub created_at before this
serving:
  mode: static          # static | service
  service_url: ""       # https://<worker>.<subdomain>.workers.dev/ — required when mode is service
topics: []           # optional extra Start-here tiles: [{title, slug, blurb, note}]

