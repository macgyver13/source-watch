{{ define "main" }}
<div class="wrap">
  <div class="hero">
    {{ partial "crumb.html" (dict "section" "Activity") }}
    <h1>Activity</h1>
    <p class="lede">Every tracked source. Pick the timestamp the list is sorted by, or narrow it to one source type.</p>
    <div class="filter-stack">
      <div class="filter-row">
        <span class="filter-label">Timestamp</span>
        <div class="filters" id="activity-date-chips" role="group" aria-label="Sort by timestamp"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Type</span>
        <div class="filters" id="activity-type-chips" role="group" aria-label="Filter by source type"></div>
      </div>
    </div>
  </div>
  <p class="coverage" id="activity-count"><b>–</b> items</p>
  <section class="feed feed-full" id="activity-feed" aria-label="Latest activity">
    <div class="feed-label">Latest activity</div>
    <p class="muted">Loading feed…</p>
  </section>
</div>
{{ end }}
