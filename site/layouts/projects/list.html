{{ define "main" }}
<div class="wrap">
  <div class="hero">
    {{ partial "crumb.html" (dict "section" "Projects") }}
    <h1>Project atlas</h1>
    <p class="lede">Coverage plus collector matches. Inclusion is a match, not a review.</p>
    <div class="toolbar">
      <input class="search" id="atlas-search" type="search" placeholder="Search projects…" value="" aria-label="Search projects">
      <div class="filters" id="atlas-chips" style="margin:0"></div>
    </div>
  </div>
  <p class="coverage" id="atlas-coverage"><b>–</b> projects</p>
  <div class="legend">
    <span><i class="dot repo"></i> repo</span>
    <span><i class="dot docs"></i> docs</span>
    <span><i class="dot pr"></i> PR</span>
    <span><i class="dot crate"></i> crate</span>
  </div>
  <div class="grid" id="atlas-grid"></div>
</div>
{{ end }}
