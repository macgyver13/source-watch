{{ define "main" }}
<div class="wrap">
  <div class="hero">
    {{ partial "crumb.html" (dict "section" "Sources") }}
    <h1>Sources</h1>
    <p class="lede">Monitored public sources behind this feed. Inclusion is a match, not a review.</p>
    <div class="toolbar">
      <input class="search" id="source-search" type="search" placeholder="Search sources…" value="" aria-label="Search sources">
      <div class="filters" id="source-chips" style="margin:0"></div>
    </div>
  </div>
  <div id="source-list" class="feed" style="max-width:none">
    <p class="muted">Loading sources…</p>
  </div>
</div>
{{ end }}
